name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Same Python minor version as the interpreter bundled in the NVIDIA SDK.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned test and lint tools (usd-core matches the runtime SDK version).
      - name: Install Python test dependencies
        run: pip install -r tests/requirements.txt

      - name: Lint Python (Ruff)
        run: ruff check UsdPreviewHandlerServer/ UsdPythonToolsServer/ tests/python/ tools/ UsdShellExtensionTests/fake_worker.py

      - name: Test Python (pytest)
        run: pytest tests/python -rs

      - name: Lint PowerShell (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $settings = Join-Path $env:GITHUB_WORKSPACE "PSScriptAnalyzerSettings.psd1"
          $files = Get-ChildItem -Path . -Include "*.ps1","*.psm1" -Recurse -File
          $results = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings $settings -Severity Warning,Error }
          if ($results) { $results; exit 1 }

      # Locked-file tests are skipped automatically on non-Windows runners.
      - name: Test PowerShell (Pester)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 6.2.0
          $config = New-PesterConfiguration
          $config.Run.Path = "tests/powershell"
          $config.Run.Exit = $true
          $config.Output.Verbosity = "Detailed"
          Invoke-Pester -Configuration $config
